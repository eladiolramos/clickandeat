spring:
  application:
    name: clickandeat
  datasource:
    url: jdbc:postgresql://${DB_HOST:127.0.0.1}:${DB_HOST_PORT:5432}/${POSTGRES_DB:clickandeat}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    hikari:
      pool-name: clickandeat-pool
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

